name: Restore PostgreSQL Backup to Render

on:
  workflow_dispatch:

jobs:
  restore-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 16 client (Ubuntu 24.04 noble compatible)
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg lsb-release

          # Add PostgreSQL official GPG key (modern keyring method)
          sudo install -d /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg

          # Add PostgreSQL APT repo
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/postgresql-pgdg.list

          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Verify pg_restore binaries and versions
        run: |
          echo "System pg_restore:"
          which pg_restore || true
          pg_restore --version || true

          echo "PostgreSQL 16 pg_restore:"
          ls -l /usr/lib/postgresql/16/bin/pg_restore
          /usr/lib/postgresql/16/bin/pg_restore --version

      - name: Restore backup to Render PostgreSQL (force pg_restore 16)
        env:
          DATABASE_URL_RESTORE: ${{ secrets.DATABASE_URL_RESTORE }}
        run: |
          if [ -z "$DATABASE_URL_RESTORE" ]; then
            echo "DATABASE_URL_RESTORE secret is not set"
            exit 1
          fi

          echo "Restoring database with PostgreSQL 16 pg_restore..."

          /usr/lib/postgresql/16/bin/pg_restore \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            --dbname="$DATABASE_URL_RESTORE" \
            Homeroute/backup/backup_20260207_0112.sql

      - name: Done
        run: echo "Database restore completed successfully"
