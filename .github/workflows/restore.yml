name: Restore PostgreSQL Backup to Render

on:
  workflow_dispatch:

jobs:
  restore-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore backup using official PostgreSQL container
        env:
          DATABASE_URL_RESTORE: ${{ secrets.DATABASE_URL_RESTORE }}
        run: |
          if [ -z "$DATABASE_URL_RESTORE" ]; then
            echo "DATABASE_URL_RESTORE secret is not set"
            exit 1
          fi

          docker run --rm \
            -v "$PWD/Homeroute/backup:/backup:ro" \
            postgres:17 \
            pg_restore \
              --no-owner \
              --no-privileges \
              --clean \
              --if-exists \
              --dbname="$DATABASE_URL_RESTORE" \
              /backup/backup_20260514_0337.sql

      - name: Done
        run: echo "Database restore completed successfully"
